version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiscaldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: ./
      dockerfile: ./FiscalDocumentProcessor.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FISCALDB_CONNECTION=Host=db;Port=5432;Database=fiscaldb;Username=postgres;Password=postgres
      - RABBITMQ_URI=${RABBITMQ_URI}
      - RABBITMQ_EXCHANGE=fiscal.documents
      - RABBITMQ_ROUTING_KEY=document.processed
    depends_on:
      - db
    ports:
      - "8080:8080"
volumes:
  pgdata:
